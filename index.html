<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeshTavern Converter</title>
  </head>
  <body>
    <header>
      <h1>MeshTavern Converter</h1>
      <label>Open an STL (or a GLB) <input id="file" type="file" accept=".stl,.glb" /></label>
      <p id="status">Drop an STL anywhere on the page. The file stays on your computer.</p>
      <progress id="progress" max="100" value="0" hidden></progress>
      <label id="up-label" hidden
        >Up axis in file
        <select id="up"></select
      ></label>
      <div id="levels" role="group" aria-label="Detail level" hidden></div>
      <div id="stress" role="group" aria-label="Stress test" hidden>
        <button type="button" data-count="100">100 minis</button>
        <button type="button" data-count="400">400 minis</button>
        <button type="button" data-count="100" data-lod="0">100 minis, all 50k</button>
        <button type="button" data-count="0">Single mini</button>
      </div>
      <div id="export" hidden>
        <button id="download" type="button">Download GLB</button>
        <label><input id="compact" type="checkbox" /> Compressed (smaller; not for Blender)</label>
      </div>
      <fieldset id="look" hidden>
        <legend>Look</legend>
        <label><input id="look-enabled" type="checkbox" checked /> Primed and washed</label>
        <label>Base coat <input id="look-base" type="color" value="#9aa0a8" /></label>
        <label
          >Shadows <input id="look-occlusion" type="range" min="0" max="1" step="0.05"
        /></label>
        <label>Wash <input id="look-wash" type="range" min="0" max="1" step="0.05" /></label>
        <label>Edges <input id="look-edges" type="range" min="0" max="1" step="0.05" /></label>
      </fieldset>
      <dl id="stats" hidden></dl>
      <p id="perf"></p>
    </header>
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
