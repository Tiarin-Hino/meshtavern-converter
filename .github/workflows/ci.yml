name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The e2e run alone takes 11–20 minutes since the painting spec (#127), depending on the
    # runner; 25 minutes in all cut off a run that passed (#156). It had grown to 28.5 minutes on
    # main by #175; with the mask's tests (#138) it takes about 31, and 35 in all cut it off.
    # Main's runs took 37–42 minutes in all by #165, and with the painter's panel's tests (#166)
    # a run passed 45 and was cut off.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a PR's merge commit and the base it merges into, for the scope step
      # A PR that changes only the docs and the files that steer the agents and the reviews (DOCS_ONLY)
      # gets the format check alone. The job still runs, because `ci` is a required check and a
      # workflow that does not start never reports. Every other PR and every push to main get the
      # whole run, so main's run is the net behind this list. README.md is code here: tests read it.
      - name: Scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          DOCS_ONLY: '^(docs/|\.claude/|CLAUDE\.md$|CONTRIBUTING\.md$|\.mcp\.json$|\.github/([^/]+|ISSUE_TEMPLATE/.+|workflows/(pr-review|claude)\.yml)$)'
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eqv "$DOCS_ONLY"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: steps.scope.outputs.code != 'false'
        run: npm run check
      - if: steps.scope.outputs.code == 'false'
        run: npm run format:check
      - if: steps.scope.outputs.code != 'false'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.code != 'false'
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.scope.outputs.code != 'false' }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      # The reference pictures that differ, by name, so the Linux set can be taken from CI's own
      # Chromium (#146, docs/guides/reference-screenshots.md, `npm run shots:take`).
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.scope.outputs.code != 'false' }}
        with:
          name: reference-screens-actual
          path: test-results/reference-screens-*/*-actual.png
          if-no-files-found: ignore
          retention-days: 14
