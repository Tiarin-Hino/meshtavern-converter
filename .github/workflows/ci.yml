name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The e2e run alone takes 11–20 minutes since the painting spec (#127), depending on the
    # runner; 25 minutes in all cut off a run that passed (#156).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      # The reference pictures that differ, by name, so the Linux set can be taken from CI's own
      # Chromium (#146, docs/guides/reference-screenshots.md, `npm run shots:take`).
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: reference-screens-actual
          path: test-results/reference-screens-*/*-actual.png
          if-no-files-found: ignore
          retention-days: 14
