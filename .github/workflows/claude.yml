name: Claude Code

# Answers `@claude` in issues and PRs. The repo is public: only the owner, members and
# collaborators can call it, so strangers cannot spend the subscription.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # claude-code-action@v1 installs Claude Code 2.1.278, which cannot run Opus 5.5: that
      # needs 2.1.280 or newer ("does not support this model", converter PR #68). Install a
      # version that can and hand it to the action. Drop this once the action ships one.
      - name: Install Claude Code
        id: claude-code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.280
          echo "path=$(command -v claude)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.claude-code.outputs.path }}
          additional_permissions: |
            actions: read
          claude_args: '--model claude-opus-5-5' # development model; reviews use Fable 5.1
