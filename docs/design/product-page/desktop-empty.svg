<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .wire { fill: none; stroke: #2b2b2b; stroke-width: 1.5; }
    .fill { fill: #f5f5f5; stroke: #2b2b2b; stroke-width: 1.5; }
    .card { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .btn { fill: #2b2b2b; }
    .btn-text { fill: #fff; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .btn2 { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; }
    .btn2-text { fill: #2b2b2b; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .h1 { font-size: 18px; font-weight: 700; fill: #2b2b2b; }
    .h2 { font-size: 26px; font-weight: 700; fill: #2b2b2b; text-anchor: middle; }
    .m { font-size: 14px; fill: #666; }
    .mc { font-size: 14px; fill: #666; text-anchor: middle; }
    .note { font-size: 12px; fill: #b3541e; font-style: italic; }
  </style>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="#fff"/>
  <!-- viewport: the viewer's grid fills everything below the top bar -->
  <rect x="0" y="56" width="1280" height="744" fill="#fafafa"/>
  <rect x="0" y="56" width="1280" height="744" fill="url(#grid)"/>
  <!-- top bar -->
  <rect class="fill" x="0" y="0" width="1280" height="56"/>
  <text class="h1" x="24" y="35">MeshTavern Converter</text>
  <text class="m" x="250" y="34">Runs in your browser. Your file never leaves your computer.</text>
  <rect class="btn2" x="1112" y="12" width="144" height="32" rx="6"/>
  <text class="btn2-text" x="1184" y="33">Open an STL</text>
  <!-- drop card -->
  <rect class="card" x="380" y="290" width="520" height="260" rx="12"/>
  <text class="h2" x="640" y="352">Drop an STL here</text>
  <rect class="btn" x="560" y="382" width="160" height="44" rx="8"/>
  <text class="btn-text" x="640" y="410">Choose a file</text>
  <text class="mc" x="640" y="466">Your file never leaves your computer.</text>
  <text class="mc" x="640" y="490">You get a game-ready mini in seconds. Everything runs in this tab.</text>
  <!-- annotation -->
  <text class="note" x="24" y="80">Empty state, desktop 1280 × 800. The grid is the viewer's own table; the card floats over it. Dropping a file works anywhere on the page, in every state.</text>
</svg>
