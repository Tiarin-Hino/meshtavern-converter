<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .fill { fill: #f5f5f5; stroke: #2b2b2b; stroke-width: 1.5; }
    .card { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; }
    .btn2 { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; }
    .btn2-text { fill: #2b2b2b; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .h1 { font-size: 18px; font-weight: 700; fill: #2b2b2b; }
    .h2 { font-size: 22px; font-weight: 700; fill: #2b2b2b; text-anchor: middle; }
    .tc { font-size: 15px; fill: #8a4b00; text-anchor: middle; }
    .m { font-size: 14px; fill: #666; }
    .mc { font-size: 14px; fill: #666; text-anchor: middle; }
    .note { font-size: 12px; fill: #b3541e; font-style: italic; }
  </style>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="#fff"/>
  <rect x="0" y="56" width="1280" height="744" fill="#fafafa"/>
  <rect x="0" y="56" width="1280" height="744" fill="url(#grid)"/>
  <!-- top bar -->
  <rect class="fill" x="0" y="0" width="1280" height="56"/>
  <text class="h1" x="24" y="35">MeshTavern Converter</text>
  <text class="m" x="250" y="34">Runs in your browser. Your file never leaves your computer.</text>
  <rect class="btn2" x="1112" y="12" width="144" height="32" rx="6"/>
  <text class="btn2-text" x="1184" y="33">Open an STL</text>
  <!-- error card -->
  <rect class="card" x="380" y="270" width="520" height="300" rx="12"/>
  <rect x="380" y="270" width="520" height="6" fill="#d98b2b"/>
  <text class="h2" x="640" y="322">This file did not become a mini</text>
  <text class="mc" x="640" y="348">dragon-cut.stl</text>
  <text class="tc" x="640" y="386">This file ends too early: it was probably cut off while</text>
  <text class="tc" x="640" y="408">downloading or copying. Download or export it again.</text>
  <rect class="btn2" x="548" y="440" width="184" height="44" rx="8"/>
  <text class="btn2-text" x="640" y="468">Choose another file</text>
  <text class="mc" x="640" y="530">Your file never leaves your computer.</text>
  <!-- annotations -->
  <text class="note" x="24" y="80">Error state, desktop. The message is the one from problems.ts, unchanged (#43); the card holds it in #status with the class "problem", as the tests read it.</text>
  <text class="note" x="24" y="98">Dropping the next file works as in every state; the button is the phone's way. Nothing technical on the card: the detail goes to the console, as today.</text>
</svg>
