<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .fill { fill: #f5f5f5; stroke: #2b2b2b; stroke-width: 1.5; }
    .card { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .btn { fill: #2b2b2b; }
    .btn-text { fill: #fff; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .btn2 { fill: #fff; stroke: #2b2b2b; stroke-width: 1.5; }
    .btn2-text { fill: #2b2b2b; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .h1 { font-size: 16px; font-weight: 700; fill: #2b2b2b; }
    .h2 { font-size: 22px; font-weight: 700; fill: #2b2b2b; text-anchor: middle; }
    .mc { font-size: 13px; fill: #666; text-anchor: middle; }
    .note { font-size: 11px; fill: #b3541e; font-style: italic; }
  </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="390" height="844" fill="#fff"/>
  <rect x="0" y="56" width="390" height="788" fill="#fafafa"/>
  <rect x="0" y="56" width="390" height="788" fill="url(#grid)"/>
  <!-- top bar -->
  <rect class="fill" x="0" y="0" width="390" height="56"/>
  <text class="h1" x="16" y="34">MeshTavern Converter</text>
  <rect class="btn2" x="298" y="12" width="76" height="32" rx="6"/>
  <text class="btn2-text" x="336" y="33">Open</text>
  <!-- drop card -->
  <rect class="card" x="16" y="250" width="358" height="300" rx="12"/>
  <text class="h2" x="195" y="310">Drop an STL here</text>
  <rect class="btn" x="40" y="340" width="310" height="48" rx="8"/>
  <text class="btn-text" x="195" y="370">Choose a file</text>
  <text class="mc" x="195" y="428">Your file never leaves your computer.</text>
  <text class="mc" x="195" y="452">You get a game-ready mini in seconds.</text>
  <text class="mc" x="195" y="472">Everything runs in this tab.</text>
  <!-- annotations -->
  <text class="note" x="16" y="76">Empty state, phone 390 × 844 (max-width 600 px).</text>
  <text class="note" x="16" y="92">No drag and drop on a phone: the button is the primary control</text>
  <text class="note" x="16" y="108">everywhere, 48 px high here, at least 44 px. The top bar drops the</text>
  <text class="note" x="16" y="124">promise text; it stays in the card. Nothing scrolls sideways.</text>
</svg>
